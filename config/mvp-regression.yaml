tests:
  - name: {{ opensearch_index | replace("performance.", "") }}
    uuid_field: prow_job_id
    version_field: git_commit
    timestamp: "@timestamp"
    threshold: 10

    metadata:
      scenario_name.keyword: mvp

    metrics:
      - name: rhdh_avg_response_time
        metric_of_interest: results.aggregated.avg_response_time.mean
        agg:
          agg_type: max
        direction: 1
        threshold: 10
        labels: ["[RHDH: Latency]"]

      - name: rhdh_cpu
        metric_of_interest: measurements.rhdh_developer_hub.cpu.mean
        agg:
          agg_type: max
        direction: 1
        threshold: 5
        labels: ["[RHDH: Developer Hub CPU]"]

      - name: rhdh_postgresql_cpu
        metric_of_interest: measurements.rhdh_postgresql.cpu.mean
        agg:
          agg_type: max
        direction: 1
        threshold: 5
        labels: ["[RHDH: PostgreSQL CPU]"]

      - name: rhdh_memory
        metric_of_interest: measurements.rhdh_developer_hub.memory.mean
        agg:
          agg_type: max
        direction: 1
        threshold: 10
        labels: ["[RHDH: Developer Hub memory]"]

      - name: rhdh_postgresql_memory
        metric_of_interest: measurements.rhdh_postgresql.memory.mean
        agg:
          agg_type: max
        direction: 1
        threshold: 10
        labels: ["[RHDH: PostgreSQL memory]"]

      # Disk is noisy — monitor both directions, looser gate
      - name: rhdh_disk_throughput
        metric_of_interest: measurements.rhdh_developer_hub.disk_throughput.mean
        agg:
          agg_type: max
        direction: 0
        threshold: 30
        labels: ["[RHDH: Developer Hub Disk]"]

      - name: rhdh_postgresql_disk_throughput
        metric_of_interest: measurements.rhdh_postgresql.disk_throughput.mean
        agg:
          agg_type: max
        direction: 0
        threshold: 30
        labels: ["[RHDH: PostgreSQL Disk]"]

      - name: rhdh_avg_content_length
        metric_of_interest: results.aggregated.avg_content_length.mean
        agg:
          agg_type: max
        direction: 0
        threshold: 25
        labels: ["[RHDH: Payload]"]
