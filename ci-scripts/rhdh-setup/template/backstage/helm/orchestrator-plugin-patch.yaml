---
- package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator:pr_4564__6.3.2
  enabled: true
  pluginConfig:
    dynamicPlugins:
      frontend:
        red-hat-developer-hub.backstage-plugin-orchestrator:
          # Legacy exports require `module: Legacy` — they are not available on the default PluginRoot module.
          translationResources:
            - importName: orchestratorTranslations
              ref: orchestratorTranslationRef
              module: Legacy
          appIcons:
            - importName: OrchestratorIcon
              module: Legacy
              name: orchestratorIcon
          dynamicRoutes:
            - importName: OrchestratorPage
              module: Legacy
              menuItem:
                icon: orchestratorIcon
                text: Orchestrator
                textKey: menuItem.orchestrator
              path: /orchestrator
          entityTabs:
            - path: /workflows
              title: Workflows
              titleKey: catalog.entityPage.workflows.title
              mountPoint: entity.page.workflows
          mountPoints:
            - mountPoint: entity.page.workflows/cards
              importName: OrchestratorCatalogTab
              module: Legacy
              config:
                layout:
                  gridColumn: 1 / -1
                if:
                  anyOf:
                    - hasAnnotation: orchestrator.io/workflows
- package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator-backend:pr_4564__8.14.2
  enabled: true
  pluginConfig:
    orchestrator:
      dataIndexService:
        url: http://sonataflow-platform-data-index-service.${RHDH_NAMESPACE}
- package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator-backend-module-loki:pr_4564__1.6.2
  enabled: false
- package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator-form-widgets:pr_4564__2.4.1
  enabled: true
  pluginConfig:
    dynamicPlugins:
      frontend:
        red-hat-developer-hub.backstage-plugin-orchestrator-form-widgets:
          pluginModule: Legacy
- package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-backend-module-orchestrator:pr_4564__1.9.2
  enabled: true
  pluginConfig:
    orchestrator:
      dataIndexService:
        url: http://sonataflow-platform-data-index-service.${RHDH_NAMESPACE}
