name: PR checks

on:
  pull_request:
    branches:
      - main
      - "rhdh-v1.*"

env: {}

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up shfmt
        env:
          SHFMT_VERSION: v3.13.1
        run: |
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run linters
        run: make lint

      - name: Check shell script formatting
        run: git ls-files -z '*.sh' | xargs -0 shfmt -d -i 4
